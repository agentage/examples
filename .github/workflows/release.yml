name: Release

# A merge is the release: agentage extension release --changed gives each extension whose folder
# differs from its last <id>@* tag a date version YYYY.MDD.N, the tag <id>@<version>, its images,
# the records on the GitHub release and npm with OIDC (a private package skips npm). One that fails
# does not stop the others; the run ends with one table and is red when any failed.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Images, records, packages of the changed extensions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extensions/*/package-lock.json

      # A hold line without a reason fails the run (release-hold.sh), so a typo never releases a held folder.
      # A held folder leaves this checkout (sparse), so the cli neither sees it nor tags it.
      - name: Hold the extensions named in .github/release-hold
        id: hold
        run: |
          set -euo pipefail
          keep=()
          for d in extensions/*/; do
            name=$(basename "$d")
            why=$(.github/scripts/release-hold.sh .github/release-hold "$name")
            if [ -n "$why" ]; then
              echo "AMBER $name: not released: $why"
              echo "::warning title=$name is held::$why"
            else
              keep+=("${d%/}")
            fi
          done
          if [ "${#keep[@]}" -lt "$(find extensions -mindepth 1 -maxdepth 1 -type d | wc -l)" ]; then
            git sparse-checkout set --cone "${keep[@]}"
          fi
          test -z "$(git status --porcelain)"
          echo "any=$([ "${#keep[@]}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install and verify each extension (its own lockfile)
        if: steps.hold.outputs.any == 'true'
        run: |
          set -euo pipefail
          for d in extensions/*/; do
            (cd "$d" && npm ci --ignore-scripts && npm run verify)
          done
      - if: steps.hold.outputs.any == 'true'
        run: npm install -g npm@11 # OIDC needs npm >= 11.5.1
      - if: steps.hold.outputs.any == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: steps.hold.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y @agentage/cli@0.73.0 extension release --changed # pinned: the merge-release cli
